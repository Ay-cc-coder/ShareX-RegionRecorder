name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            rid: win-x64
          - name: win-arm64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/RegionRecorder/RegionRecorder.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: |
          $zip = "RegionRecorder-${{ matrix.name }}.zip"
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegionRecorder-${{ matrix.name }}
          path: RegionRecorder-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ShareX 区域录屏 ${GITHUB_REF_NAME}" \
            --generate-notes
